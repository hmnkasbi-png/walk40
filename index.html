.main{max-width:560px;margin:0 auto;padding:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:${G.paper};border-top:1px solid ${G.line};display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:${G.rock};padding:4px 6px;min-width:58px}
.tab.on{color:${G.wadi};font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.day{background:transparent;border:1px solid ${G.line};border-radius:10px;padding:6px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:${G.sub}}
.day.sel{border-color:${G.ink};background:${G.paper};color:${G.ink};font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;box-sizing:border-box}
.session{background:${G.paper};border-radius:18px;padding:18px;border:1px solid ${G.line}}
.s-date{font-size:13px;color:${G.sub};display:flex;align-items:center;gap:6px}
.s-title{font-size:20px;font-weight:600;margin:2px 0 10px}
.s-km{font-size:48px;font-weight:700;line-height:1;color:${G.wadi}}
.s-km small{font-size:18px;font-weight:500;margin-inline-start:6px}
.s-hint{font-size:13px;color:${G.sub};margin:8px 0 0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;background:${G.wadi};color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:transparent;color:${G.ink};border:1px solid #C9D0CB}
.btn.full{width:100%}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:${G.wadi};font-size:14px;padding:6px 0;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec{margin-top:24px}
.sec h3{font-size:16px;font-weight:600;margin:0 0 8px}
.bar{height:8px;background:${G.line};border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:${G.wadi}}
.alert{border-right:4px solid ${G.rock};background:${G.paper};padding:10px 12px;border-radius:10px 0 0 10px;margin-bottom:8px}
.alert.stop{border-right-color:${G.red}}
.alert.warn{border-right-color:${G.yellow}}
.alert.good{border-right-color:${G.wadi}}
.alert.test{border-right-color:${G.ink}}
.alert b{display:block;font-size:14px}
.alert p{margin:2px 0 0;font-size:13px;color:#3D4A4E}
.alert ul{margin:6px 0 0;padding-right:18px;font-size:13px;color:#3D4A4E}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:${G.sub};margin-bottom:4px}
.inp{width:100%;border:1px solid #C9D0CB;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:${G.ink}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #C9D0CB;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;color:${G.ink}}
.chip.on{background:${G.ink};color:#fff;border-color:${G.ink}}
.app input[type=range]{width:100%;accent-color:${G.wadi}}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid ${G.line};gap:8px}
.muted{color:${G.sub};font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:10px 12px;background:${G.paper};border-radius:12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:${G.sub}}
.phase{margin-bottom:24px}
.phase-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.phase-num{width:30px;height:30px;border-radius:50%;border:2px solid ${G.ink};display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.phase h2{font-size:17px;margin:0}
.phase-head p{margin:0;font-size:13px;color:${G.sub}}
.week{width:100%;text-align:right;background:${G.paper};border:1px solid ${G.line};border-radius:12px;padding:10px 12px;margin-bottom:6px;color:${G.ink};display:block}
.week.cur{border-color:${G.wadi};box-shadow:inset -4px 0 0 ${G.wadi}}
.days{padding:0 12px 10px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#E1E6E2;color:${G.ink};margin-inline-start:6px;white-space:nowrap;font-weight:500}
.badge.test{background:${G.yellow}}
.badge.light{background:${G.wadiSoft}}
.report{background:${G.paper};border-radius:14px;padding:14px;font-size:14px;margin-top:12px}
.report h4{margin:10px 0 2px;font-size:14px;color:${G.wadi}}
.acc{border-bottom:1px solid ${G.line}}
.acc>button{width:100%;background:none;border:0;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:${G.ink};text-align:right}
.acc-body{padding:0 0 16px;font-size:14px}
.acc-body p{margin:0 0 8px}
.acc-body ul{margin:0 0 8px;padding-right:18px}
.t{width:100%;border-collapse:collapse;font-size:14px}
.t td{padding:7px 0;border-bottom:1px solid #E1E5E1}
.t td:last-child{text-align:left;color:${G.sub};white-space:nowrap}
.tip{margin-top:14px;padding:12px 14px;border-radius:12px;background:${G.wadiSoft};font-size:14px}
.nudge{margin-bottom:14px;width:100%;text-align:right;background:${G.ink};color:#fff;border:0;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.loading{display:flex;align-items:center;gap:8px;justify-content:center;padding:40px;color:${G.sub}}
.err{background:#F4DEDC;color:${G.red};font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.savebar{font-size:12px;color:${G.sub};display:flex;align-items:center;gap:4px;margin:-6px 0 10px}
.savebar.ok{color:${G.wadi}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
